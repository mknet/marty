# Hosting-like vhost (mpm_event + mod_cgid + suexec + php-fpm). See Dockerfile.hosting.
ExtendedStatus On

# Mirrors the hoster: keep-alive on, no Content-Length buffering tricks.
KeepAlive On

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/site

    # CGIs run as the site user through suexec. suexec drops every environment variable that
    # is not on its compiled-in safe list (CGI/1.1 vars, HTTP_*, SSL_*), so PassEnv/SetEnv
    # toggles such as BENCH_TIMING never reach the handlers here — exactly as on the hoster.
    SuexecUserGroup site site

    ScriptAlias /cgi-bin/ /var/www/site/cgi-bin/
    <Directory /var/www/site/cgi-bin>
        AllowOverride None
        Options +ExecCGI -MultiViews
        Require all granted
    </Directory>

    <Directory /var/www/site/php>
        AllowOverride None
        AcceptPathInfo On
        Require all granted
    </Directory>

    <Location "/server-status">
        SetHandler server-status
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
