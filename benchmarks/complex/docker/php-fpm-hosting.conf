; php-fpm pool for the hosting-like bench container (runs as the site user like a hoster's FPM).
[www]
user = site
group = site
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Pass the bench toggle through FPM (suexec is not involved for PHP).
env[BENCH_TIMING] = $BENCH_TIMING
clear_env = no
