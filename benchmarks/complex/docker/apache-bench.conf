# Apache vhost for Marty complex benchmarks (mod_php + CGI).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Bench: when BENCH_TIMING=1, handlers append pre-compute µs to /var/log/bench-timing/requests.log
    PassEnv BENCH_TIMING

    # CGI bench fairness: Marty writes a single small TCP segment (Content-Length response),
    # Go writes chunked across multiple segments. With KeepAlive On, the Linux client side
    # delayed-ACK timer (~40 ms) waits for a second segment before ACKing, which artificially
    # inflates back-to-back single-connection latency for Marty but not for Go. Disable
    # KeepAlive for the bench vhost so each request uses its own connection — fair for all
    # handlers and reflects how Apache CGI is typically deployed.
    KeepAlive Off

    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory /usr/lib/cgi-bin>
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require all granted
    </Directory>

    <Directory /var/www/html/php>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
