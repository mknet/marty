name: marty-bench-complex

services:
  bench:
    build:
      context: ../..
      # Default: mod_php + mod_cgi + prefork (reference for RESULTS-SNAPSHOTS).
      # Hosting-like (mpm_event + mod_cgid + suexec + php-fpm): see `just bench-fair-hosting`.
      dockerfile: "${BENCH_DOCKERFILE:-benchmarks/complex/docker/Dockerfile}"
      args:
        MARTY_RUSTFLAGS: "${MARTY_RUSTFLAGS:-}"
        MARTY_TARGET_CPU: "${MARTY_TARGET_CPU:-}"
        MARTY_PGO_PROFILE: "${MARTY_PGO_PROFILE:-}"
    ports:
      - "${BENCH_PORT:-8081}:80"
    environment:
      BENCH_TIMING: "${BENCH_TIMING:-1}"
      GO_COMPLEX_RAW_CGI: "${GO_COMPLEX_RAW_CGI:-0}"
      LLVM_PROFILE_FILE: "${LLVM_PROFILE_FILE:-/tmp/marty-pgo/marty-%p-%m.profraw}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
