[package]
name = "marty-complex-bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Marty complex benchmark: CPU-heavy GET routes (standalone sync CGI binary)."

[features]
# Pacing on by default (prefork/mod_cgi reference runs). A/B without it:
#   MARTY_CARGO_FLAGS="--no-default-features" BENCH_REBUILD=1 just bench-fair-...
default = ["apache-cgi-pacing"]
apache-cgi-pacing = ["marty/apache-cgi-pacing"]

[dependencies]
marty = { path = "../../../marty", default-features = false, features = ["sync-cgi"] }
