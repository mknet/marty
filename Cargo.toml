[workspace]
resolver = "3"
default-members = ["marty"]
members = [
    "marty",
    "examples/demo_logic",
    "examples/01_basic",
    "examples/02_routing",
    "examples/03_session",
    "examples/04_cookies",
    "examples/05_sqlite",
    "examples/06_axum",
    "examples/07_mysql",
    "examples/_gen_htaccess",
    "examples/_http-cgi-server",
    "examples/sample-cgi-script",
    "benchmarks/simple/marty-webhook",
    "benchmarks/complex/shared",
    "benchmarks/complex/marty-sync",
    "benchmarks/complex/marty-axum",
    "tools/hosting-probe/probe-rs",
    "tools/cargo-marty",
]
# Cloud alternatives keep their own Cargo.lock / deps (Lambda, GCF, …).
exclude = [
    "alternatives/aws-lambda/01_basic",
    "alternatives/aws-lambda/02_dynamodb",
    "alternatives/aws-lambda/03_mysql",
    "alternatives/aws-lambda/04_complex",
    "alternatives/azure-functions/01_basic",
    "alternatives/azure-functions/02_complex",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Fat LTO for complex Marty sync bench (`cargo build -p marty-sync --profile bench`).
[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
