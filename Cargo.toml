[workspace]
resolver = "3"
default-members = ["marty"]
members = [
    "marty",
    "examples/01_basic",
    "examples/02_routing",
    "examples/03_session",
    "examples/04_cookies",
    "examples/05_sqlite",
    "examples/_http-cgi-server",
    "examples/sample-cgi-script",
    "benchmarks/simple/marty-webhook",
    "benchmarks/complex/marty-complex",
    "tools/hosting-probe/probe-rs",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Fat LTO for marty-complex-bench only (`cargo build -p marty-complex-bench --profile bench`).
[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
