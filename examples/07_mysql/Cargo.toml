[package]
name = "marty-07-mysql"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Marty example 07_mysql: sync Router + MySQL/MariaDB (all-inkl–style shared hosting)."

[package.metadata.marty]
alias = "mysql"
path_info = false

[dependencies]
marty = { path = "../../marty", default-features = false, features = ["sync-cgi", "config"] }
marty-demo-logic = { path = "../demo_logic" }
# No OpenSSL/aws-lc — fine for typical all-inkl localhost MySQL (no TLS).
# For TLS to a remote host, switch to features = ["default-rustls"].
mysql = { version = "25", default-features = false, features = ["minimal-rust", "derive", "buffer-pool"] }

[build-dependencies]
marty = { path = "../../marty", default-features = false, features = ["htaccess"] }
