[package]
name = "marty-hosting-probe"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Read-only CGI probe: reports process, parent chain, fd types and system facts to mirror a hosting Apache locally."

[dependencies]

# Source lives in cargo-marty so `cargo marty probe` can embed it (crates.io ships only crate files).
[[bin]]
name = "marty-hosting-probe"
path = "../../cargo-marty/probe/main.rs"
