[package]
name = "marty"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Rust CGI for shared hosting: sync Router, optional Axum, build-time .htaccess mounts. One static binary → cgi-bin/."
documentation = "https://docs.rs/marty"
repository = "https://github.com/mknet/marty"
readme = "../README.md"
license = "Apache-2.0"
keywords = ["cgi", "hyper", "tower", "http", "gateway"]
categories = ["network-programming", "web-programming::http-server"]

[features]
default = ["hyper-cgi"]
# Sync [`Router`](crate::Router) / [`CgiRequest`](crate::CgiRequest) without hyper (smaller binaries).
# Includes query/form/cookie helpers. Add **`session`** for signed cookie sessions.
sync-cgi = []
# HMAC-signed cookie sessions (`SessionStore`) for process-per-request CGI.
session = ["dep:hmac", "dep:sha2"]
# Apache `.htaccess` mount generator (`marty::htaccess`) — no extra deps; for consumer `build.rs`.
# Reads `[package.metadata.marty]` (alias) + package name (binary).
htaccess = []
# Hyper-based CGIRequest/CGIResponse and optional Tower integration.
hyper-cgi = ["dep:hyper", "dep:bytes", "dep:http-body-util"]
tower = ["hyper-cgi", "dep:tower", "dep:axum"]

[dependencies]
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true }
snafu = "0.9"
bytes = { version = "1", optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
axum = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[package.metadata.docs.rs]
all-features = true
