[package]
name = "marty"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Great Scott! Rust helpers for CGI—map RFC 3875 to hyper, glue tower services, and hit 88 mph without a flux capacitor. Evolved from mknet/cgi-rs."
documentation = "https://docs.rs/marty"
repository = "https://github.com/mknet/marty"
readme = "../README.md"
license = "Apache-2.0"
keywords = ["cgi", "hyper", "tower", "http", "gateway"]
categories = ["network-programming", "web-programming::http-server"]

[features]
default = ["hyper-cgi"]
# Sync [`Router`](crate::Router) / [`CgiRequest`](crate::CgiRequest) without hyper (smaller binaries).
sync-cgi = []
# Pace stdout CGI responses for Apache mod_cgi/prefork by writing headers and
# body as separate phases with a tiny delay. Keep this opt-in: the default path
# remains the fastest single-write response for servers that do not need pacing.
apache-cgi-pacing = []
# Hyper-based CGIRequest/CGIResponse and optional Tower integration.
hyper-cgi = ["dep:hyper", "dep:bytes", "dep:http-body-util"]
tower = ["hyper-cgi", "dep:tower", "dep:axum"]

[dependencies]
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true }
snafu = "0.9"
bytes = { version = "1", optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }
axum = { version = "0.8", optional = true }

[package.metadata.docs.rs]
all-features = true
